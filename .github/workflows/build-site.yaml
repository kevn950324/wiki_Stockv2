name: Build Stock Wiki

on:
  push:
    branches: [v5]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx quartz plugin install
      - run: npx quartz build -d content
      - uses: actions/upload-artifact@v7
        with:
          name: stock-wiki-site
          path: public
